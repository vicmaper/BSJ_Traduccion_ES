name: Construir BSJ_Kit.exe

# Se arma solo al publicar una version (Releases > Draft a new release) o a mano (Actions > Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.10.0 numpy==1.26.4 opencv-python-headless==4.10.0.84 pillow fonttools 
      - name: Prueba rapida (importar todo)
        working-directory: herramientas
        run: python -c "import bsj_kit, bsj_estilo, revisar_bsj, avisos_auto, bsj_gen_ui, bsj_gen_config, bsj_ui, hmj_ui, hmj_dzi, hmj_fuente_es, pl_build, pl_cadenas, pl_extraer, pl_exec_tool; print('ok')"

      - name: Armar el .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name BSJ_Kit
          --paths herramientas
          --add-data "herramientas/malie_claves_garbro.json;."
          --add-data "herramientas/anchos_fuente.json;."
          --add-data "herramientas/bsj_exe_parche.json;."
          --add-data "herramientas/reglas_bsj.tsv;."
          --hidden-import bsj_kit --hidden-import bsj_estilo --hidden-import revisar_bsj --hidden-import avisos_auto
          --hidden-import hmj_wrap --hidden-import pl_extraer --hidden-import pl_exec_tool --hidden-import pl_cadenas
          --hidden-import pl_build --hidden-import malie_cipher --hidden-import hmj_fuente_es
          --hidden-import hmj_ui --hidden-import hmj_dzi --hidden-import bsj_ui --hidden-import bsj_gen_ui --hidden-import bsj_gen_config
          herramientas/bsj_gui.py

      - name: Armar el zip para fans
        shell: pwsh
        run: |
          $d = "BSJ_Traduccion_ES"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item dist/BSJ_Kit.exe $d/
          Copy-Item -Recurse traduccion, herramientas $d/
          Copy-Item GUIA_PARA_FANS.txt, LEEME_PRIMERO.txt, README.md, requirements.txt, *.bat $d/
          Remove-Item -Recurse -Force $d/herramientas/__pycache__ -ErrorAction SilentlyContinue
          Compress-Archive -Path $d -DestinationPath BSJ_Traduccion_ES.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BSJ_Traduccion_ES
          path: BSJ_Traduccion_ES.zip

      - name: Subir a la version publicada
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: BSJ_Traduccion_ES.zip
